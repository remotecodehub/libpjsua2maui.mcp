name: Build, Test and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: libpjsua2maui.mcp.slnx
  HTTP_PROJECT: src/libpjsua2maui.mcp.http/libpjsua2maui.mcp.http.csproj
  STDIO_PROJECT: src/libpjsua2maui.mcp.stdio/libpjsua2maui.mcp.stdio.csproj
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/libpjsua2maui.mcp.http
  TEST_RESULTS_DIR: ${{ github.workspace }}/tests/libpjsua2maui.mcp.tests/TestResults
jobs:
  build:
    name: Continuous Integration / Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Restore Tools
        run: dotnet tool restore
      
      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" --configuration Release --no-restore
        
      - name: Test
        id: test
        shell: pwsh 
        working-directory: ${{ github.workspace }}/tests/libpjsua2maui.mcp.tests/
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path @(Join-Path '${{ env.TEST_RESULTS_DIR }}' 'QualityGate') | Out-Null
          $outputFile = Join-Path ${{ env.TEST_RESULTS_DIR }} test-output.txt
          & dotnet test ${{ github.workspace }}/tests/libpjsua2maui.mcp.tests/bin/Release/net10.0/libpjsua2maui.mcp.tests.dll --report-trx --report-trx-filename test-results.trx --results-directory "${{ env.TEST_RESULTS_DIR }}" --coverlet --coverlet-output-format cobertura `
            --v:detailed | Tee-Object -FilePath $outputFile
          $exitCode = $LASTEXITCODE
          "dotnet test exit code: $exitCode" | Add-Content -Path $outputFile
          "TEST_EXIT_CODE=$exitCode" | Out-File -FilePath ${{ env.TEST_RESULTS_DIR }}/test-exit-code.txt -Encoding utf8

      - name: Debug generated artifacts
        run: ls -R ${{ env.TEST_RESULTS_DIR }}
    
      - name: Publish Test Summary
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: 'Continuous Test Results'
          path: '${{ env.TEST_RESULTS_DIR }}/*.trx'
          reporter: 'dotnet-trx'

      - name: Generate report
        run: dotnet tool run reportgenerator -reports:"${{ env.TEST_RESULTS_DIR }}/coverage.cobertura.*.xml" -targetdir:"${{ env.TEST_RESULTS_DIR }}/Report" -reporttypes:"MarkdownSummary;TextSummary" -classfilters:"+libpjsua2maui.mcp*;-Program"

      - name: Enforce quality gate (Line, Branch and Method coverage)
        if: always()
        shell: pwsh
        env:
          QUALITY_GRADE_THRESHOLD: 90
        run: |
          $summaryFile = Join-Path ${{ env.TEST_RESULTS_DIR }} "/Report/Summary.txt"
          if (-not (Test-Path $summaryFile)) {
              "## Coverage gate`n`nThe ReportGenerator Summary.txt report was not produced." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Write-Error "Summary coverage data was not produced."
              exit 1
          }
          
          $content = Get-Content $summaryFile -Raw
          $threshold = [double]$env:QUALITY_GRADE_THRESHOLD

          # Extração dos dados do cabeçalho do Summary.txt
          $lineMatch = [regex]::Match($content, '(?im)^\s*Line coverage:\s*([0-9]+(?:\.[0-9]+)?)%')
          $methodMatch = [regex]::Match($content, '(?im)^\s*Method coverage:\s*([0-9]+(?:\.[0-9]+)?)%')
          $branchMatch = [regex]::Match($content, '(?im)^\s*Branch coverage:\s*([0-9]+(?:\.[0-9]+)?)%')
          $coveredBranchesMatch = [regex]::Match($content, '(?im)^\s*Covered branches:\s*([0-9]+)')
          $totalBranchesMatch = [regex]::Match($content, '(?im)^\s*Total branches:\s*([0-9]+)')

          if (-not $lineMatch.Success -or -not$methodMatch.Success) {
              Write-Error "Quality Gate aborted: unable to extract line or method coverage data from Summary.txt."
              exit 1
          }

          $lineRate = [double]$lineMatch.Groups[1].Value
          $methodRate = [double]$methodMatch.Groups[1].Value

          # Cálculo/Extração de Branch Coverage robusto
          $branchRate = 0
          if ($branchMatch.Success) {
              $branchRate = [double]$branchMatch.Groups[1].Value
          } elseif ($coveredBranchesMatch.Success -and$totalBranchesMatch.Success) {
              $cb = [double]$coveredBranchesMatch.Groups[1].Value
              $tb = [double]$totalBranchesMatch.Groups[1].Value
              if ($tb -eq 0) {
                  $branchRate = 100.0             } else {$branchRate = [math]::Round(($cb * 100 / $tb), 1)
              }
          } else {
              Write-Error "Quality Gate aborted: unable to extract branch coverage data from Summary.txt."
              exit 1
          }

          # Status visuais para o resumo
          $lineStatus = if ($lineRate -ge$threshold) { '✅' } else { '❌' }
          $branchStatus = if ($branchRate -ge $threshold) { '✅' } else { '❌' }
          $methodStatus = if ($methodRate -ge$threshold) { '✅' } else { '❌' }

          # Escrevendo no Summary do GitHub Actions
          @"
          ## Coverage gate
          | Metric | Result | Minimum | Status |
          | --- | ---: | ---: | ---: |
          | Line coverage | $([math]::Round($lineRate, 2))% | $threshold\% | $lineStatus |
          | Branch coverage | $([math]::Round($branchRate, 2))% | $threshold\% | $branchStatus |
          | Method coverage | $([math]::Round($methodRate, 2))% | $threshold\% | $methodStatus |
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # Salvando os arquivos de texto auxiliares
          $qualityGateDir = ${{ env.TEST_RESULTS_DIR }} 
          if (-not (Test-Path $qualityGateDir)) { New-Item -ItemType Directory -Path$qualityGateDir | Out-Null }
          
          "$([math]::Round($lineRate, 2))" | Out-File (Join-Path $qualityGateDir "line-rate.txt") -Encoding utf8
          "$([math]::Round($branchRate, 2))" | Out-File (Join-Path $qualityGateDir "branch-rate.txt") -Encoding utf8
          "$([math]::Round($methodRate, 2))" | Out-File (Join-Path $qualityGateDir "method-rate.txt") -Encoding utf8

          # Validação das regras de Quality Gate
          $failed = $false
          $failures = @()

          if ($lineRate -lt $threshold) {
              $failed = $true
              $failures += "Line coverage ($([math]::Round($lineRate, 2))\%) is below the required $threshold%."
          }
          if ($branchRate -lt $threshold) {
            $failed = $true
            $failures += "Branch coverage ($([math]::Round($branchRate, 2))\%) is below the required $threshold%."
          }
          if ($methodRate -lt $threshold) {
              $failed = $true
              $failures += "Method coverage ($([math]::Round($methodRate, 2))\%) is below the required $threshold%."
          }

          if ($failed) {
              $summaryText =$failures -join " "
              Write-Warning "Quality Gate failed: $summaryText"
              exit 1
          }

      - name: Append test execution report
        if: always()
        shell: pwsh
        run: if (Test-Path ${{ env.TEST_RESULTS_DIR }}/Report/Summary.md) { Get-Content ${{ env.TEST_RESULTS_DIR }}/QualityGate/Report/Summary.md | Add-Content $env:GITHUB_STEP_SUMMARY } else { Add-Content $env:GITHUB_STEP_SUMMARY 'Coverage report was not generated.' }

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Continuous-Testing-Reports
          path: ${{ env.TEST_RESULTS_DIR }}
          if-no-files-found: warn

  docker:
    name: Build HTTP Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-,format=short

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/libpjsua2maui.mcp.http/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nuget:
    name: Continuous Delivery
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.STDIO_PROJECT }}"

      - name: Calculate package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack dotnet tool
        run: dotnet pack "${{ env.STDIO_PROJECT }}" --configuration Release --no-restore --output ./artifacts -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Publish to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
